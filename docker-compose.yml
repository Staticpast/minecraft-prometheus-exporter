version: "3.8"

services:
  mc:
    image: itzg/minecraft-server:2026.11.0-java25
    environment:
      EULA: "true"
      VERSION: "26.3"
      TYPE: "PAPER"

    ports:
      - "25565:25565"
      - "9940:9940"
    volumes:
      - ./docker/data:/data
    stdin_open: true
    tty: true
    restart: unless-stopped
