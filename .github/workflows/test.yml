name: Maven Test

on:
  push:
    branches: [ staticpast ]
  pull_request:
    branches: [ staticpast ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build the plugin
    # GitHub-hosted runner: this repository is public, so a pull request from a fork must not reach a self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Set up JDK 25
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: '25'
        cache: maven

    - name: Test and build
      run: mvn --batch-mode --no-transfer-progress verify
