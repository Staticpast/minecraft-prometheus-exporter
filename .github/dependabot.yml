version: 2
updates:
  # GitHub Actions: the workflows pin each action to a commit SHA.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    assignees:
      - "McKenzieJDan"
    commit-message:
      prefix: "github"
      include: "scope"

  # Maven: the plugin and its test dependencies.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:30"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    assignees:
      - "McKenzieJDan"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
